name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# A second push to the same branch cancels the run still in flight, so the
# green rate reflects the latest commit rather than a queue of stale ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci, never npm install. It installs exactly what the lockfile says
      # and fails if the lockfile and package.json have drifted — which is the
      # defect this step exists to catch.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Stray table rows, ragged tables, unclosed fences, broken relative links
      # -- and any tracked text file carrying a raw NUL byte, which makes it
      # binary to git and invisible to every grep run against this repository.
      #
      # This script was written in 0.21.1 *because* a malformed table reached
      # `main` and every check in use was a grep for a string, so nothing
      # noticed. It then sat in the repository and in nobody's pipeline for
      # four days, running only when somebody remembered -- which is the same
      # failure one level up. It runs here now.
      - name: Check the documentation and the source encoding
        run: node tools/docs/check.mjs

      # The guide tells every visitor to press a drainage pit and follow the
      # water from it, which only works where the council's record carries an
      # inlet with a path onward. Whether one exists near a given address is a
      # fact about the *artefact*, and a new release of map.json or trace.json
      # can take it away without a single test failing.
      #
      # It is a script rather than a test for the same reason the check above
      # is: it is a claim about published data. It is also four and a half
      # seconds over 4,089 addresses in a suite the runner already times at six
      # against a five-second gate, and it runs here in a sixth of a second.
      - name: Check the guide against the published artefacts
        run: node tools/data/check-guide.mjs

      # Three artefacts now describe the same 281 areas, and they are three
      # because AC 2.2.1.b caps the board at thirty "where the data is, not
      # where it is drawn". Two files that must stay equal with nothing to
      # notice when they stop is a failure this repository has had once
      # already; the answer there was to delete one, and it cannot be taken
      # here because these answer different questions.
      - name: Check the area artefacts against each other
        run: node tools/data/check-areas.mjs

      # The derived layers ship twice: Kensington's own build for the bundled
      # fallback, and a council-wide build for the database. On 13 September
      # the thresholds changed, only the first was rebuilt, and the deployed
      # map kept the old hatching with every test green.
      - name: Check the council derived layers against the bundled copy
        run: node tools/data/check-derived.mjs

      # Coverage thresholds live in vitest.config.ts: 88% overall, 90% for
      # packages/schema. A shortfall fails the job.
      - name: Test with coverage
        run: npm run coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt

      - name: Install
        run: pip install -e . -r requirements-dev.txt

      # Coverage threshold (90%) is in pyproject.toml, so the gate moves with
      # the config rather than being restated here.
      - name: Test with coverage
        run: pytest

  # The tests that need a database, in a job of their own.
  #
  # They are deliberately not in `check`: that job is the five-second gate and
  # runs on any machine with nothing but Node. These need Postgres, and without
  # it they do not fail informatively — they refuse to start. A service
  # container gives them one here so that they are actually run rather than
  # being a suite only the author can execute.
  #
  # The image is pinned to the same major version as Cloud SQL, so a migration
  # that applies here applies there.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drainlens
          POSTGRES_PASSWORD: drainlens-ci-only
          POSTGRES_DB: drainlens
        ports:
          - 5433:5432
        # Without this the job races the container and fails on connection
        # refused, intermittently, which is the worst kind of red.
        options: >-
          --health-cmd "pg_isready -U drainlens -d drainlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The suite applies the migration itself and loads the published
      # artefacts, so there is no fixture to keep in step with the schema.
      - name: Test against Postgres
        run: npm run test:db
        env:
          DATABASE_URL: postgres://drainlens:drainlens-ci-only@localhost:5433/drainlens
