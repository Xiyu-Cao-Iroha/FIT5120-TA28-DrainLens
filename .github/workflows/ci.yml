name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  # Weekly, on the default branch, with no commit to trigger it (penetration
  # test P07). A dependency or base image that was clean when it merged can
  # have an advisory published against it later, and nothing else in this file
  # would ever look again. Monday 06:17 in Melbourne (AEST); cron is UTC. Every
  # job runs, not only `security`, which is harmless and also catches a test
  # that has started failing with nothing changed.
  schedule:
    - cron: "17 20 * * 0"
  workflow_dispatch:

# The token every job gets can read the repository and nothing else
# (penetration test P07). No step here pushes, comments or publishes, and the
# coverage artifact needs no extra permission. A job that needs more should
# ask for it on its own.
permissions:
  contents: read

# A second push to the same branch cancels the run still in flight, so the
# green rate reflects the latest commit rather than a queue of stale ones.
# The event is part of the key so that the weekly run and a push to main do
# not cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# **Every action is pinned to a full commit SHA** (penetration test P07). A tag
# such as `actions/checkout@v4` is a pointer its owner can move, so a
# compromised or mistaken release would have run here, with this repository's
# token, on the next push. A SHA cannot be moved. The tag stays in the comment
# beside it, for the reader and for Dependabot. To move a pin, take the latest
# release in the same major and resolve it:
#
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag>
#
# and, if the object returned is of type `tag` (an annotated tag), once more
# with `gh api repos/<owner>/<repo>/git/tags/<sha>` for the commit it names.
# Container images below are pinned by digest for the same reason. And
# `persist-credentials: false` everywhere: nothing here pushes, so the token
# is not left in .git/config for a later step to find.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # npm ci, never npm install. It installs exactly what the lockfile says
      # and fails if the lockfile and package.json have drifted — which is the
      # defect this step exists to catch.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Stray table rows, ragged tables, unclosed fences, broken relative links
      # -- and any tracked text file carrying a raw NUL byte, which makes it
      # binary to git and invisible to every grep run against this repository.
      #
      # This script was written in 0.21.1 *because* a malformed table reached
      # `main` and every check in use was a grep for a string, so nothing
      # noticed. It then sat in the repository and in nobody's pipeline for
      # four days, running only when somebody remembered -- which is the same
      # failure one level up. It runs here now.
      - name: Check the documentation and the source encoding
        run: node tools/docs/check.mjs

      # The guide tells every visitor to press a drainage pit and follow the
      # water from it, which only works where the council's record carries an
      # inlet with a path onward. Whether one exists near a given address is a
      # fact about the *artefact*, and a new release of map.json or trace.json
      # can take it away without a single test failing.
      #
      # It is a script rather than a test for the same reason the check above
      # is: it is a claim about published data. It is also four and a half
      # seconds over 4,089 addresses in a suite the runner already times at six
      # against a five-second gate, and it runs here in a sixth of a second.
      - name: Check the guide against the published artefacts
        run: node tools/data/check-guide.mjs

      # Three artefacts now describe the same 281 areas, and they are three
      # because AC 2.2.1.b caps the board at thirty "where the data is, not
      # where it is drawn". Two files that must stay equal with nothing to
      # notice when they stop is a failure this repository has had once
      # already; the answer there was to delete one, and it cannot be taken
      # here because these answer different questions.
      - name: Check the area artefacts against each other
        run: node tools/data/check-areas.mjs

      # The derived layers ship twice: Kensington's own build for the bundled
      # fallback, and a council-wide build for the database. On 13 September
      # the thresholds changed, only the first was rebuilt, and the deployed
      # map kept the old hatching with every test green.
      - name: Check the council derived layers against the bundled copy
        run: node tools/data/check-derived.mjs

      # The warning signs and the low areas they mark are two files from one
      # terrain run. Rebuild one alone and a sign lands on ground with no low
      # area under it.
      - name: Check the low-area warnings against the low areas they mark
        run: node tools/data/check-warnings.mjs

      # The comparison fetches four tiles by name for whichever drain is
      # chosen, so a missing tile is one street's comparison failing on the
      # site while every other street works.
      - name: Check the scenario tile pack against its index and the council map
        run: node tools/data/check-scene-tiles.mjs

      # The Terrain layer fetches a tile by name as its square comes into view.
      # A missing one is a square of the council that stays blurred, with
      # nothing on screen to say why; and its tiles must be the scenario pack's.
      - name: Check the terrain tile pack against its index and the scenario pack
        run: node tools/data/check-terrain-tiles.mjs

      # The verified events are written by hand, so nothing rebuilds them and
      # nothing else notices an event tied to an area the map does not have —
      # that event is shown nowhere, silently.
      - name: Check the verified flood events against the map's areas
        run: node tools/data/check-events.mjs

      # Coverage thresholds live in vitest.config.ts: 88% overall, 90% for
      # packages/schema. A shortfall fails the job.
      - name: Test with coverage
        run: npm run coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.lock

      # From the hashed lock, not from the ranges in pyproject.toml
      # (penetration test P07). The ranges say what the pipeline is compatible
      # with; the lock says what was tested, and --require-hashes refuses any
      # file whose content differs from what was locked, including one swapped
      # on the index under the same version number. The package itself goes in
      # second: --no-deps, so it cannot pull anything the lock does not name,
      # and --no-build-isolation, so it is built with the locked setuptools
      # rather than whatever the index serves that day.
      # Regenerating the lock: pipeline/README.md, "Locked dependencies".
      - name: Install
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps --no-build-isolation -e .

      # Coverage threshold (90%) is in pyproject.toml, so the gate moves with
      # the config rather than being restated here.
      - name: Test with coverage
        run: pytest

  # The tests that need a database, in a job of their own.
  #
  # They are deliberately not in `check`: that job is the five-second gate and
  # runs on any machine with nothing but Node. These need Postgres, and without
  # it they do not fail informatively — they refuse to start. A service
  # container gives them one here so that they are actually run rather than
  # being a suite only the author can execute.
  #
  # The image is pinned to the same major version as Cloud SQL, so a migration
  # that applies here applies there.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # Pinned by digest (penetration test P07), with the tag it was read from.
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: drainlens
          POSTGRES_PASSWORD: drainlens-ci-only
          POSTGRES_DB: drainlens
        ports:
          - 5433:5432
        # Without this the job races the container and fails on connection
        # refused, intermittently, which is the worst kind of red.
        options: >-
          --health-cmd "pg_isready -U drainlens -d drainlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The suite applies the migration itself and loads the published
      # artefacts, so there is no fixture to keep in step with the schema.
      - name: Test against Postgres
        run: npm run test:db
        env:
          DATABASE_URL: postgres://drainlens:drainlens-ci-only@localhost:5433/drainlens

  # Dependency, secret and image scanning (penetration test P07), which until
  # now happened only when somebody remembered to run it. It runs on every pull
  # request and push like the jobs above, and weekly on its own, because an
  # advisory published after a merge changes the answer without changing the
  # code.
  #
  # The scanners run from container images pinned by digest rather than from
  # their GitHub Actions: gitleaks-action needs a paid licence for an
  # organisation's repositories, and trivy-action's tags were rewritten in
  # March 2026 to ship a credential stealer. A digest cannot be rewritten, and
  # these are the same commands a developer can run locally.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

    steps:
      # The whole history, not the tip: a key committed and then deleted is
      # still in every clone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Fails on any finding. The workspace belongs to the runner's user and
      # the container runs as another, so git inside it has to be told the
      # directory is safe. --redact keeps a found secret out of the very log
      # that reports it. A false positive goes in .gitleaks.toml with its
      # reason, never into this line.
      - name: Scan the history for secrets
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/repo
          "$GITLEAKS_IMAGE"
          git /repo --redact --no-banner --exit-code 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # What ships, only: --omit=dev leaves out the test and build toolchain,
      # which reaches neither image. High and critical fail the job.
      - name: Audit the npm dependencies that ship
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements-audit.lock

      # pip-audit is itself installed from a hashed lock, into a venv of its
      # own. It reads requirements.lock directly -- --disable-pip is allowed
      # because every line is hashed -- so it audits exactly what the
      # `pipeline` job installs, on no resolver's say-so.
      - name: Audit the pipeline's locked Python dependencies
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/pip" install --require-hashes -r pipeline/requirements-audit.lock
          "$RUNNER_TEMP/pip-audit/bin/pip-audit" --strict --disable-pip --require-hashes -r pipeline/requirements.lock

      - name: Build the site image
        run: docker build -t site .

      - name: Build the API image
        id: api-image
        run: docker build -f deploy/api/Dockerfile -t api .

      # A CRITICAL or HIGH finding with a fix available fails the job. One with
      # no fix is left out, because nothing in this repository can act on it.
      # The secret scanner reads the image layers too, so a file .dockerignore
      # missed is found here rather than in the registry. The two scans share
      # one download of the vulnerability database through a named volume.
      - name: Scan the site image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v trivy-cache:/root/.cache
          "$TRIVY_IMAGE"
          image --scanners vuln,secret
          --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1
          --no-progress site

      # Runs even when the site scan failed, so one run reports both images.
      # The API image is built after the site image, so this is skipped when
      # an earlier step stopped the job before it existed.
      - name: Scan the API image
        if: ${{ !cancelled() && steps.api-image.outcome == 'success' }}
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v trivy-cache:/root/.cache
          "$TRIVY_IMAGE"
          image --scanners vuln,secret
          --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1
          --no-progress api
