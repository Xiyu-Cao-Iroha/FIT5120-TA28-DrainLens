[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drainlens-pipeline"
version = "0.1.0"
description = "Offline geospatial pipeline. Runs on a developer machine and publishes versioned static artefacts; never deployed."
requires-python = ">=3.11"
# openpyxl reads the one source that is published as a spreadsheet rather
# than as an API or a shapefile: the VICSES incident counts. It is a build
# dependency only -- nothing it touches reaches the browser.
dependencies = ["numpy>=1.26", "scipy>=1.11", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=drainlens_pipeline --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["src/drainlens_pipeline"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError"]
