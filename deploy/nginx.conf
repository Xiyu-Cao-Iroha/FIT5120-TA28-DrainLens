# Serving DrainLens. Three things here are load-bearing and each fails quietly.
#
#   1. A module worker is refused outright at any non-JavaScript content type.
#      The map still draws, so losing the entire comparison feature looks like
#      nothing happening at all.
#   2. Without gzip the first visit is 6.42 MB instead of 1.37 MB. The site
#      works; it is four times heavier.
#   3. /data is not content-hashed. A rebuilt artefact behind a long cache is
#      a map that silently disagrees with the model it was built beside.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Overrides the included mapping for the three extensions this site serves.
  #
  # It has to be a `types` block. `add_header Content-Type` **appends** a
  # second header rather than replacing the first, and a response carrying two
  # Content-Type lines is malformed — which is what the first version of this
  # file produced, and what `curl -I` caught before it ever went out.
  types {
    text/javascript           js mjs;
    application/json          json;
    application/octet-stream  bin;
  }

  # Cloud Run captures stdout. Access logging is off because every line would
  # carry the client IP, and AD1 says this product keeps none — see
  # deploy/README.md. This is only half of it: Cloud Run writes its own
  # request log with `remoteIp` regardless, and the exclusion filter that
  # stops it has to be applied before the first request, not after.
  access_log off;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;
  keepalive_timeout 620s;

  gzip              on;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_vary         on;
  gzip_proxied      any;
  # The .bin arrays are the payload: 5 MB raw, 1.2 MB gzipped. octet-stream is
  # not in nginx's default gzip_types and is the one that matters most here.
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/octet-stream
    image/svg+xml;

  server {
    # Rewritten to $PORT at start-up; see the Dockerfile.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Content-hashed by Vite, so a new build has a new name and this can never
    # serve a stale file.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Artefacts. Not hashed, so a short life only.
    location /data/ {
      add_header Cache-Control "public, max-age=300" always;
      try_files $uri =404;
    }

    # index.html names the hashed assets. Cached, it points at files the next
    # deploy has already replaced.
    location = /index.html {
      add_header Cache-Control "no-cache" always;
    }

    # Single page: anything that is not a file is the application. /data and
    # /assets are real files served above before this applies, and a missing
    # artefact 404s there rather than silently returning the HTML — which
    # would reach `assertUsable` as a parse error instead of a 404.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
