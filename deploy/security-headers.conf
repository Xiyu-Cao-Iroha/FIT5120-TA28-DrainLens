# Browser defence headers, on every response the site sends.
#
# From the team's penetration test (P02, P03, P08): none of these were sent,
# which is what let the signed-in site be framed under a decoy button and what
# left a second barrier missing behind React's escaping.
#
# **Included in the server block and again in every location that sets a
# header of its own.** nginx inherits `add_header` from the enclosing block
# only when the inner block declares none, so a location that adds
# Cache-Control silently drops everything declared above it. That is the
# failure this file exists to make hard: one list, included wherever headers
# are set.
#
# `always`, so the 401 the gate sends carries them too.
#
# __API_ORIGIN__ is replaced at start-up by deploy/entrypoint.sh with the
# origin the bundle was built to ask (VITE_API_BASE), or with nothing when the
# site was built without one. Nothing else in the policy names another host:
# fonts, data, tiles and the scenario worker are all this origin's.
#
# - style-src 'self' is enough because React applies `style` props through the
#   DOM, which CSP does not govern; there is no <style> element in the app.
# - img-src allows data: and blob: for canvas-produced images only; nothing is
#   loaded from another host.
# - frame-ancestors 'none' and X-Frame-Options DENY are the same rule for new
#   and old browsers.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' __API_ORIGIN__; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# No subdomains and no preload: the site lives on a run.app host whose other
# subdomains are not this project's to make promises for.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
